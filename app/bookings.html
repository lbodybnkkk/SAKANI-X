<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجوزاتي | SAKANI-X</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-shell"></div>

<div class="container" style="padding-top:16px;">
  <h1 style="margin-bottom:14px;">📖 حجوزاتي</h1>
  <div id="bookingsList"></div>
  <div id="bookingsEmpty" class="empty-state" style="display:none;">
    <div class="icon">📭</div>
    <p>لا توجد حجوزات حتى الآن</p>
    <a href="index.html" class="btn" style="margin-top:10px;display:inline-block;">تصفح السكنات</a>
  </div>
</div>

<script type="module">
  import { mountShell, getMyBookings } from "./app.js";

  mountShell("bookings");

  document.addEventListener("sakani:auth", async (e) => {
    if (!e.detail.user) {
      document.getElementById("bookingsEmpty").style.display = "block";
      document.getElementById("bookingsEmpty").querySelector("p").textContent = "سجّل الدخول لعرض حجوزاتك";
      return;
    }
    const bookings = await getMyBookings();
    const list = document.getElementById("bookingsList");
    document.getElementById("bookingsEmpty").style.display = bookings.length ? "none" : "block";
    list.innerHTML = bookings.map(b => `
      <div class="dash-row">
        <div style="font-size:1.8rem;">🛏️</div>
        <div class="dash-row-info">
          <strong>${b.propTitle}</strong>
          <p style="margin:2px 0;color:var(--muted);font-size:.8rem;">${b.room} • سرير ${String(b.bed).replace('b','')} • ${b.price} د.أ/شهرياً</p>
          <span class="status-pill review">${b.status}</span>
        </div>
      </div>
    `).join("");
  });
</script>
</body>
</html>
