<!-- داخل bookings.html، استبدل main -->
<main style="padding: 20px;" id="bookingsList">
    <div id="bookingsContent">
        <!-- سيتم التحميل ديناميكياً -->
    </div>
</main>

<script type="module">
import { auth } from "./firebase-config.js";
import { listenToUserBookings } from "./data-service.js";
import { showToast } from "./auth.js";

auth.onAuthStateChanged((user) => {
    const container = document.getElementById("bookingsContent");
    if (!user) {
        container.innerHTML = `
            <div style="text-align:center; padding:60px 20px;">
                <i class="fa-solid fa-lock" style="font-size:48px; color:var(--text-muted); opacity:0.4;"></i>
                <h3 style="margin-top:16px;">سجّل دخولك لعرض حجوزاتك</h3>
                <button onclick="window.location.href='index.html'" 
                        class="btn-submit-luxury" style="margin-top:16px; width:auto; padding:12px 32px;">
                    العودة للرئيسية
                </button>
            </div>`;
        return;
    }

    listenToUserBookings(user.uid, (bookings) => {
        if (bookings.length === 0) {
            container.innerHTML = `
                <div style="text-align:center; padding:60px 20px; color:var(--text-muted);">
                    <i class="fa-solid fa-calendar-xmark" style="font-size:48px; margin-bottom:16px; opacity:0.3;"></i>
                    <h3>لا توجد حجوزات بعد</h3>
                    <p>تصفح الوحدات واحجز سريرك الآن</p>
                </div>`;
            return;
        }

        container.innerHTML = bookings.map(b => {
            const statusMap = {
                pending: { label: "قيد المراجعة", color: "#f59e0b", bg: "rgba(245,158,11,0.15)" },
                approved: { label: "مؤكد ومفعل", color: "#10b981", bg: "rgba(16,185,129,0.15)" },
                rejected: { label: "مرفوض", color: "#ef4444", bg: "rgba(239,68,68,0.15)" }
            };
            const s = statusMap[b.status] || statusMap.pending;
            return `
            <div class="housing-card" style="padding:18px; margin-bottom:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <span class="badge-tag" style="background:${s.bg}; color:${s.color};">${s.label}</span>
                    <span style="font-size:12px; color:var(--text-muted);">#${b.id?.slice(-6)}</span>
                </div>
                <h3 style="font-size:16px; font-weight:700;">${b.housingTitle}</h3>
                <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">تاريخ الانتقال: ${b.moveInDate}</p>
                ${b.notes ? `<p style="font-size:13px; color:var(--text-muted); margin-top:4px;">ملاحظات: ${b.notes}</p>` : ''}
                <hr style="border:none; border-top:1px dashed var(--border-color); margin:12px 0;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <a href="https://wa.me/201000000000" target="_blank" 
                       class="chip active" style="padding:6px 14px; font-size:12px; text-decoration:none;">
                        تواصل مع الدعم
                    </a>
                </div>
            </div>`;
        }).join('');
    });
});
</script>
