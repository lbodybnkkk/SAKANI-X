<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل السكن | SAKANI-X</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body style="padding-bottom: 110px;">

  <header class="app-header">
    <a href="index.html" class="nav-item" style="width: auto;"><i class="fa-solid fa-arrow-right" style="font-size: 20px; color: var(--primary);"></i></a>
    <span style="font-weight: 700; font-size: 16px;">تفاصيل السكن</span>
  </header>

  <div style="padding: 20px;">
    <div style="position: relative; height: 240px; border-radius: var(--radius-lg); overflow: hidden;">
      <img id="propImage" src="" alt="السكن" style="width: 100%; height: 100%; object-fit: cover;" />
    </div>

    <div style="margin-top: 15px;">
      <h2 id="propTitle" style="font-size: 20px; font-weight: 800;">--</h2>
      <p id="propLocation" style="color: var(--text-muted); font-size: 14px; margin-top: 5px;"><i class="fa-solid fa-location-dot" style="color: var(--accent-gold);"></i> --</p>
    </div>

    <hr style="border: none; border-top: 1px solid var(--border-color); margin: 20px 0;" />

    <h4 style="font-size: 16px; font-weight: 700; margin-bottom: 8px;">حدد السرير المطلوبة للحجز:</h4>
    <div class="beds-container" id="bedsGrid"></div>
  </div>

  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 16px 20px; box-shadow: 0 -8px 25px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 1000;">
    <div>
      <span style="font-size: 11px; color: var(--text-muted);">السعر الشهري</span>
      <div id="propPrice" style="font-size: 18px; font-weight: 800; color: var(--accent-gold);">--</div>
    </div>
    <button class="btn-submit-luxury" style="width: auto; padding: 0 28px;" onclick="confirmBooking()">تأكيد الحجز الآن</button>
  </div>

  <script type="module">
    import { loadPropertyDetails } from './app.js';
    document.addEventListener("DOMContentLoaded", loadPropertyDetails);
  </script>
</body>
</html>
