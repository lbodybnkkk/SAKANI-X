<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل السكن | SAKANI-X</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body style="padding-bottom: 110px;">

  <header class="app-header">
    <a href="index.html" style="color: #fff; text-decoration: none;"><i class="fa-solid fa-arrow-right" style="font-size: 18px;"></i></a>
    <span style="font-weight: 800;">تفاصيل السكن</span>
    <div style="width: 20px;"></div>
  </header>

  <div style="padding: 20px;">
    <div style="position: relative; height: 220px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-color);">
      <img id="propImage" src="" alt="السكن" style="width: 100%; height: 100%; object-fit: cover;" />
    </div>

    <div style="margin-top: 15px;">
      <h2 id="propTitle" style="font-size: 20px; font-weight: 800;">--</h2>
      <p id="propLocation" style="color: var(--text-muted); font-size: 14px; margin-top: 5px;"><i class="fa-solid fa-location-dot" style="color: var(--accent-gold);"></i> --</p>
    </div>

    <hr style="border: none; border-top: 1px solid var(--border-color); margin: 20px 0;" />

    <h4 style="font-size: 15px; font-weight: 800; margin-bottom: 8px;">حدد السرير المطلوب للحجز:</h4>
    <div class="beds-container" id="bedsGrid"></div>
  </div>

  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 16px 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); z-index: 1000;">
    <div>
      <span style="font-size: 11px; color: var(--text-muted);">السعر الشهري</span>
      <div id="propPrice" style="font-size: 18px; font-weight: 800; color: var(--accent-gold);">--</div>
    </div>
    <button class="btn-submit-luxury" style="width: auto; padding: 0 28px;" onclick="window.confirmBooking()">تأكيد الحجز</button>
  </div>

  <!-- النافذة المنبثقة للتسجيل -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-modal-content">
      <div class="modal-drag-indicator" onclick="window.closeAuthModal()"></div>
      <div class="auth-header"><h3>تسجيل الدخول</h3></div>
      <button class="btn-social" type="button" onclick="window.handleGoogleLogin()">
        <i class="fa-brands fa-google" style="color: #ea4335;"></i>
        <span>المتابعة بواسطة Google</span>
      </button>
      <div class="auth-divider"><span>أو عبر البريد</span></div>
      <form onsubmit="window.handleEmailAuth(event)">
        <input type="email" id="authEmail" class="input-field" placeholder="البريد الإلكتروني" required />
        <input type="password" id="authPassword" class="input-field" placeholder="كلمة المرور" required />
        <button type="submit" class="btn-submit-luxury">دخول</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
