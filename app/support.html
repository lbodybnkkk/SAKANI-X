<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدعم والبروفايل | SAKANI-X</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body style="padding: 20px 20px 100px 20px;">

  <!-- أرثام الدعم المباشرة أعلى الصفحة -->
  <div class="support-header-card">
    <h3 style="font-size: 18px; font-weight: 800;">مركز المساعدة والدعم الفني</h3>
    <p style="font-size: 13px; color: #94a3b8; margin-top: 4px;">تواصل معنا فوراً على مدار الساعة</p>
    
    <div class="support-phones">
      <a href="tel:01000000001" class="phone-chip">
        <i class="fa-solid fa-phone-volume" style="color: var(--accent-gold);"></i>
        <span>01000000001</span>
      </a>
      <a href="tel:01100000002" class="phone-chip">
        <i class="fa-solid fa-headset" style="color: var(--accent-gold);"></i>
        <span>01100000002</span>
      </a>
    </div>
  </div>

  <!-- ملف البروفايل التفاعلي -->
  <div id="profileSection"></div>

  <!-- القائمة السفلية -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="bookings.html" class="nav-item"><i class="fa-solid fa-calendar-check"></i><span>حجوزاتي</span></a>
    <a href="support.html" class="nav-item active"><i class="fa-solid fa-headset"></i><span>الدعم والبروفايل</span></a>
  </nav>

  <!-- النافذة المنبثقة للتسجيل -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-modal-content">
      <div class="modal-drag-indicator" onclick="window.closeAuthModal()"></div>
      <div class="auth-header"><h3>تسجيل الدخول</h3></div>
      <button class="btn-social" type="button" onclick="window.handleGoogleLogin()">
        <i class="fa-brands fa-google" style="color: #ea4335;"></i>
        <span>المتابعة بواسطة Google</span>
      </button>
      <div class="auth-divider"><span>أو عبر البريد</span></div>
      <form onsubmit="window.handleEmailAuth(event)">
        <input type="email" id="authEmail" class="input-field" placeholder="البريد الإلكتروني" required />
        <input type="password" id="authPassword" class="input-field" placeholder="كلمة المرور" required />
        <button type="submit" class="btn-submit-luxury">دخول</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
