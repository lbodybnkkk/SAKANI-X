<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKANI X | المنصة الرقمية الذكية للسكن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="container nav-content">
            <div class="logo">
                <i class="fa-solid fa-building-circle-check"></i>
                <h2>SAKANI <span>X</span></h2>
            </div>
            <a href="../admin/index.html" class="admin-link"><i class="fa-solid fa-user-gear"></i> لوحة الإدارة</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container hero-container">
            <h1>اعثر على سكنك المفضل بسهولة وأمان</h1>
            <p>منصة متخصصة في توفير أفضل الشقق والغرف الفندقية المجهزة للطلاب والشباب والمغتربين</p>

            <!-- Search & Filter Controls -->
            <div class="search-box">
                <div class="search-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="filter-city" placeholder="ابحث بالمدينة / المحافظة...">
                </div>
                <div class="search-item">
                    <i class="fa-solid fa-bed"></i>
                    <select id="filter-type">
                        <option value="">جميع أنواع السكن</option>
                        <option value="شقة كاملة">شقة كاملة</option>
                        <option value="غرفة خاصة">غرفة خاصة</option>
                        <option value="سرير في غرفة مشتركة">سرير في غرفة مشتركة</option>
                    </select>
                </div>
                <div class="search-item">
                    <i class="fa-solid fa-users"></i>
                    <select id="filter-gender">
                        <option value="">الجميع (شباب / بنات)</option>
                        <option value="طلاب (شباب)">طلاب (شباب)</option>
                        <option value="طالبات (بنات)">طالبات (بنات)</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container main-section">
        <div class="section-header">
            <h2>الوحدات السكنية المتاحة</h2>
            <span id="results-count">جاري التحميل...</span>
        </div>

        <div id="housing-grid" class="housing-grid">
            <!-- Dynamic Housing Cards -->
        </div>
    </main>

    <!-- Details & Booking Modal -->
    <div id="details-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn">&times;</button>
            <div id="modal-body">
                <!-- Dynamic Content Inside JS -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>© 2026 <strong>SAKANI X</strong> - جميع الحقوق محفوظة | منصة الإقامة السكنية المتكاملة</p>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
