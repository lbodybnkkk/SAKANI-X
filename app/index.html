<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAKANI-X | السكن الطلابي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="brand-logo">
      <i class="fa-solid fa-building-shield"></i>
      <span>SAKANI<span style="color: var(--accent-gold);">X</span></span>
    </a>
    <button class="user-profile-btn" onclick="window.toggleAuthModal(true)">
      <i class="fa-solid fa-user"></i>
    </button>
  </header>

  <main class="listings-grid" id="listingsContainer"></main>

  <!-- القائمة السفلية -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="bookings.html" class="nav-item"><i class="fa-solid fa-calendar-check"></i><span>حجوزاتي</span></a>
    <a href="support.html" class="nav-item"><i class="fa-solid fa-headset"></i><span>الدعم والبروفايل</span></a>
  </nav>

  <!-- نافذة تسجيل الدخول المنبثقة -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-modal-content">
      <div class="modal-drag-indicator" onclick="window.closeAuthModal()"></div>
      <div class="auth-header">
        <h3>تسجيل الدخول إلى SAKANI-X</h3>
      </div>

      <button class="btn-social" type="button" onclick="window.handleGoogleLogin()">
        <i class="fa-brands fa-google" style="color: #ea4335; font-size: 18px;"></i>
        <span>المتابعة بواسطة Google</span>
      </button>

      <div class="auth-divider"><span>أو عبر البريد الإلكتروني</span></div>

      <form onsubmit="window.handleEmailAuth(event)">
        <input type="email" id="authEmail" class="input-field" placeholder="البريد الإلكتروني" required />
        <input type="password" id="authPassword" class="input-field" placeholder="كلمة المرور" required />
        <button type="submit" class="btn-submit-luxury">دخول / إنشاء حساب</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { listenToFirebaseHousings } from './app.js';
    document.addEventListener("DOMContentLoaded", listenToFirebaseHousings);
  </script>
</body>
</html>
