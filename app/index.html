<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKANI-X | سكنك بيتك بعيد عن بيتك</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-shell"></div>

<section class="hero">
  <h1>سكنك.. بيتك بعيد عن بيتك</h1>
  <p>ابحث عن أفضل السكنات الطلابية الموثقة بالقرب من جامعتك</p>
</section>

<div class="container">
  <form class="search-card" id="searchForm">
    <select id="fCity">
      <option value="">كل المدن</option>
      <option>عمّان</option><option>إربد</option><option>الزرقاء</option><option>مادبا</option>
    </select>
    <select id="fArea">
      <option value="">المنطقة / الحي</option>
    </select>
    <select id="fType">
      <option value="">نوع السكن</option>
      <option>بنين</option><option>بنات</option><option>شباب</option><option>طالبات</option>
    </select>
    <input type="text" id="fSearch" placeholder="ابحث باسم السكن...">
    <button type="submit">🔍 بحث</button>
  </form>

  <div class="section-title" id="search">
    <h2>🔥 الأعلى طلباً</h2>
    <a href="#allList">عرض الكل</a>
  </div>
  <div class="scroll-row" id="topRequestedRow"></div>

  <div class="section-title">
    <h2>🆕 السكنات الجديدة</h2>
  </div>
  <div class="grid-cards" id="allList"></div>
  <div id="emptyResult" class="empty-state" style="display:none">
    <div class="icon">🔎</div>
    <p>لا توجد نتائج مطابقة لبحثك</p>
  </div>
</div>

<script type="module">
  import { mountShell, getAllProperties, seedSampleDataIfEmpty, propertyCardHTML, bindFavButtons } from "./app.js";

  mountShell("index");

  let allProps = {};

  async function load() {
    await seedSampleDataIfEmpty().catch(()=>{});
    allProps = await getAllProperties();
    renderTopRequested();
    renderList(allProps);
  }

  function renderTopRequested() {
    const row = document.getElementById("topRequestedRow");
    const top = Object.entries(allProps).filter(([id, p]) => p.topRequested);
    row.innerHTML = top.map(([id, p]) => propertyCardHTML(id, p)).join("") || "<p style='color:var(--muted)'>لا يوجد حالياً</p>";
    bindFavButtons(row);
  }

  function renderList(props) {
    const list = document.getElementById("allList");
    const entries = Object.entries(props);
    document.getElementById("emptyResult").style.display = entries.length ? "none" : "block";
    list.innerHTML = entries.map(([id, p]) => propertyCardHTML(id, p)).join("");
    bindFavButtons(list);
  }

  document.getElementById("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const city = document.getElementById("fCity").value;
    const type = document.getElementById("fType").value;
    const q = document.getElementById("fSearch").value.trim().toLowerCase();
    const filtered = Object.fromEntries(
      Object.entries(allProps).filter(([id, p]) => {
        return (!city || p.city === city) &&
               (!type || p.type === type) &&
               (!q || p.title.toLowerCase().includes(q));
      })
    );
    renderList(filtered);
  });

  load();
</script>
</body>
</html>
