<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المفضلة | SAKANI-X</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-shell"></div>

<div class="container" style="padding-top:16px;">
  <h1 style="margin-bottom:14px;">❤️ قائمة المفضلة</h1>
  <div class="grid-cards" id="favList"></div>
  <div id="favEmpty" class="empty-state" style="display:none;">
    <div class="icon">💔</div>
    <p>لم تقم بإضافة أي سكن للمفضلة بعد</p>
    <a href="index.html" class="btn" style="margin-top:10px;display:inline-block;">تصفح السكنات</a>
  </div>
</div>

<script type="module">
  import { mountShell, getFavoriteIds, getProperty, propertyCardHTML, bindFavButtons } from "./app.js";

  mountShell("favorites");

  document.addEventListener("sakani:auth", async (e) => {
    const empty = document.getElementById("favEmpty");
    const list = document.getElementById("favList");
    if (!e.detail.user) {
      empty.style.display = "block";
      empty.querySelector("p").textContent = "سجّل الدخول لعرض قائمة المفضلة";
      return;
    }
    const ids = await getFavoriteIds();
    if (!ids.length) { empty.style.display = "block"; return; }
    empty.style.display = "none";
    let html = "";
    for (const id of ids) {
      const p = await getProperty(id);
      if (p) html += propertyCardHTML(id, p);
    }
    list.innerHTML = html;
    bindFavButtons(list);
  });
</script>
</body>
</html>
