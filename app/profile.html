<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي | SAKANI-X</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-shell"></div>

<div class="container" style="padding-top:16px;">

  <!-- حالة عدم تسجيل الدخول -->
  <div id="authSection" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-authtab="login">تسجيل الدخول</button>
      <button class="tab-btn" data-authtab="register">حساب جديد</button>
    </div>

    <div class="tab-panel active" id="loginPanel">
      <div class="card form-grid">
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail"></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="loginPass"></div>
        <button class="btn block" id="loginBtn">دخول</button>
        <button class="btn outline block" id="googleLoginBtn">تسجيل الدخول عبر Google</button>
      </div>
    </div>

    <div class="tab-panel" id="registerPanel">
      <div class="card form-grid">
        <div class="field"><label>الاسم الكامل</label><input type="text" id="regName"></div>
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="regEmail"></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="regPass"></div>
        <button class="btn block" id="registerBtn">إنشاء الحساب</button>
      </div>
    </div>
  </div>

  <!-- حالة تسجيل الدخول -->
  <div id="profileSection" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="account">إعدادات الحساب</button>
      <button class="tab-btn" data-tab="academic">الملف الجامعي</button>
    </div>

    <div class="tab-panel active" id="accountPanel">
      <div class="card form-grid two-col">
        <div class="field" style="grid-column:1/-1;text-align:center;">
          <img id="profileAvatar" src="" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:6px;">
        </div>
        <div class="field"><label>الاسم الأول</label><input type="text" id="firstName"></div>
        <div class="field"><label>اسم العائلة</label><input type="text" id="lastName"></div>
        <div class="field"><label>رقم الهاتف</label><input type="tel" id="phone" placeholder="07XXXXXXXX"></div>
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" disabled></div>
        <div class="field" style="grid-column:1/-1;"><label>المحافظة</label>
          <select id="governorate">
            <option>عمّان</option><option>إربد</option><option>الزرقاء</option><option>مادبا</option><option>الكرك</option>
          </select>
        </div>
        <button class="btn block" style="grid-column:1/-1;" id="saveAccountBtn">💾 حفظ التغييرات</button>
      </div>
    </div>

    <div class="tab-panel" id="academicPanel">
      <div class="card form-grid two-col">
        <div class="field"><label>الجامعة</label>
          <select id="university">
            <option>الجامعة الأردنية</option><option>جامعة اليرموك</option><option>الجامعة الهاشمية</option><option>جامعة العلوم والتكنولوجيا</option>
          </select>
        </div>
        <div class="field"><label>الكلية</label><input type="text" id="college" placeholder="مثال: كلية الهندسة"></div>
        <div class="field"><label>السنة الدراسية</label>
          <select id="studyYear">
            <option>سنة أولى</option><option>سنة ثانية</option><option>سنة ثالثة</option><option>سنة رابعة</option><option>دراسات عليا</option>
          </select>
        </div>
        <div class="field"><label>التخصص</label><input type="text" id="major"></div>
        <div class="field"><label>الديانة</label>
          <select id="religion"><option>مسلم</option><option>مسيحي</option><option>أخرى</option></select>
        </div>
        <div class="field"><label>حالة التوثيق</label>
          <select id="verifStatus" disabled>
            <option>غير موثّق</option><option>قيد المراجعة</option><option>موثّق ✔</option>
          </select>
        </div>
        <button class="btn block" style="grid-column:1/-1;" id="saveAcademicBtn">💾 حفظ الملف الجامعي</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import {
    mountShell, loginEmail, registerEmail, loginGoogle, currentUser
  } from "./app.js";
  import { auth, db, ref, get, set, onAuthStateChanged } from "./firebase-config.js";

  mountShell("profile");

  document.querySelectorAll("[data-authtab]").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("[data-authtab]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("loginPanel").classList.toggle("active", btn.dataset.authtab === "login");
      document.getElementById("registerPanel").classList.toggle("active", btn.dataset.authtab === "register");
    };
  });
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("[data-tab]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("accountPanel").classList.toggle("active", btn.dataset.tab === "account");
      document.getElementById("academicPanel").classList.toggle("active", btn.dataset.tab === "academic");
    };
  });
  if (window.location.hash === "#academic") {
    document.querySelector('[data-tab="academic"]')?.click();
  }

  document.getElementById("loginBtn").onclick = async () => {
    try {
      await loginEmail(document.getElementById("loginEmail").value, document.getElementById("loginPass").value);
    } catch (e) { alert("فشل تسجيل الدخول: " + e.message); }
  };
  document.getElementById("googleLoginBtn").onclick = async () => {
    try { await loginGoogle(); } catch (e) { alert("فشل تسجيل الدخول عبر Google: " + e.message); }
  };
  document.getElementById("registerBtn").onclick = async () => {
    try {
      await registerEmail(
        document.getElementById("regEmail").value,
        document.getElementById("regPass").value,
        document.getElementById("regName").value
      );
    } catch (e) { alert("فشل إنشاء الحساب: " + e.message); }
  };

  document.addEventListener("sakani:auth", async (e) => {
    const user = e.detail.user;
    document.getElementById("authSection").style.display = user ? "none" : "block";
    document.getElementById("profileSection").style.display = user ? "block" : "none";
    if (!user) return;

    document.getElementById("email").value = user.email || "";
    document.getElementById("profileAvatar").src = user.photoURL || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(user.displayName||user.email)}`;

    const snap = await get(ref(db, `users/${user.uid}/profile`));
    const data = snap.exists() ? snap.val() : {};
    document.getElementById("firstName").value = data.firstName || user.displayName || "";
    document.getElementById("lastName").value = data.lastName || "";
    document.getElementById("phone").value = data.phone || "";
    document.getElementById("governorate").value = data.governorate || "عمّان";

    const acadSnap = await get(ref(db, `users/${user.uid}/academic`));
    const acad = acadSnap.exists() ? acadSnap.val() : {};
    if (acad.university) document.getElementById("university").value = acad.university;
    document.getElementById("college").value = acad.college || "";
    if (acad.studyYear) document.getElementById("studyYear").value = acad.studyYear;
    document.getElementById("major").value = acad.major || "";
    if (acad.religion) document.getElementById("religion").value = acad.religion;
    document.getElementById("verifStatus").value = acad.verifStatus || "غير موثّق";
  });

  document.getElementById("saveAccountBtn").onclick = async () => {
    const user = auth.currentUser;
    if (!user) return;
    await set(ref(db, `users/${user.uid}/profile`), {
      firstName: document.getElementById("firstName").value,
      lastName: document.getElementById("lastName").value,
      phone: document.getElementById("phone").value,
      email: user.email,
      governorate: document.getElementById("governorate").value
    });
    alert("✅ تم حفظ بيانات الحساب");
  };

  document.getElementById("saveAcademicBtn").onclick = async () => {
    const user = auth.currentUser;
    if (!user) return;
    await set(ref(db, `users/${user.uid}/academic`), {
      university: document.getElementById("university").value,
      college: document.getElementById("college").value,
      studyYear: document.getElementById("studyYear").value,
      major: document.getElementById("major").value,
      religion: document.getElementById("religion").value,
      verifStatus: "قيد المراجعة"
    });
    alert("✅ تم إرسال الملف الجامعي، سيتم مراجعته للتوثيق");
  };
</script>
</body>
</html>
