<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الدعم الفني | SAKANI-X</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24">

    <header class="sticky top-0 z-50 bg-white/85 backdrop-blur-xl border-b border-slate-200 px-5 py-3.5 flex items-center gap-4">
        <a href="index.html" class="text-slate-900 text-xl"><i class="fa-solid fa-arrow-right"></i></a>
        <h1 class="text-lg font-extrabold text-slate-900">الدعم الفني</h1>
    </header>

    <main class="px-5 py-6 max-w-2xl mx-auto">
        <div class="text-center mb-8">
            <div class="w-20 h-20 rounded-full bg-amber-50 flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-headset text-3xl text-amber-500"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900">مركز الدعم والمساعدة</h2>
            <p class="text-sm text-slate-500 mt-2">فريق خدمة العملاء متواجد على مدار 24 ساعة لخدمتك</p>
        </div>

        <div class="flex flex-col gap-4 mb-8">
            <a href="https://wa.me/201000000000" target="_blank" class="w-full h-14 rounded-2xl bg-[#25D366] text-white flex items-center justify-center gap-3 text-sm font-bold shadow-lg active:scale-[0.98] transition-all">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                <span>محادثة واتساب مباشرة</span>
            </a>
            <a href="https://t.me/CMD" target="_blank" class="w-full h-14 rounded-2xl bg-[#0088cc] text-white flex items-center justify-center gap-3 text-sm font-bold shadow-lg active:scale-[0.98] transition-all">
                <i class="fa-brands fa-telegram text-2xl"></i>
                <span>تواصل مع المطور CMD</span>
            </a>
            <a href="tel:19000" class="w-full h-14 rounded-2xl border-2 border-slate-200 bg-white flex items-center justify-center gap-3 text-sm font-bold shadow-sm active:scale-[0.98] transition-all">
                <i class="fa-solid fa-phone text-slate-900 text-xl"></i>
                <span>الاتصال بالخط الساخن</span>
            </a>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <h3 class="text-base font-bold text-slate-900 mb-4"><i class="fa-solid fa-ticket text-amber-500"></i> إرسال تذكرة دعم</h3>
            <input type="text" id="ticketSubject" class="w-full h-12 rounded-xl border border-slate-200 px-4 text-sm outline-none focus:border-amber-500 mb-3" placeholder="موضوع الاستفسار">
            <textarea id="ticketMessage" rows="4" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-amber-500 mb-4 resize-none" placeholder="اكتب استفسارك أو مشكلتك بالتفصيل..."></textarea>
            <button class="w-full h-12 bg-gradient-to-br from-slate-900 to-slate-800 text-white font-bold rounded-xl shadow-lg active:scale-[0.98] transition-all" onclick="submitTicket()">
                <i class="fa-solid fa-paper-plane"></i> إرسال التذكرة
            </button>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 h-[68px] bg-white/92 backdrop-blur-xl shadow-[0_-4px_25px_rgba(0,0,0,0.08)] flex justify-around items-center z-[1000] rounded-t-3xl border-t border-slate-200/60">
        <a href="index.html" class="flex flex-col items-center text-slate-400 text-[11px] font-bold gap-1 w-1/4"><i class="fa-solid fa-house text-xl"></i><span>الرئيسية</span></a>
        <a href="bookings.html" class="flex flex-col items-center text-slate-400 text-[11px] font-bold gap-1 w-1/4"><i class="fa-solid fa-calendar-check text-xl"></i><span>حجوزاتي</span></a>
        <a href="profile.html" class="flex flex-col items-center text-slate-400 text-[11px] font-bold gap-1 w-1/4"><i class="fa-solid fa-user text-xl"></i><span>حسابي</span></a>
    </nav>

    <script type="module">
        import { db, ref, push, set } from "./firebase-config.js";
        import { showToast } from "./auth.js";

        async function submitTicket() {
            const subject = document.getElementById("ticketSubject").value.trim();
            const message = document.getElementById("ticketMessage").value.trim();
            if (!subject || !message) return showToast("أكمل جميع الحقول", "error");
            
            try {
                const newRef = push(ref(db, "support_tickets"));
                await set(newRef, {
                    subject, message,
                    status: "open",
                    createdAt: Date.now()
                });
                showToast("تم إرسال تذكرتك بنجاح، سيتم الرد عليك قريباً", "success");
                document.getElementById("ticketSubject").value = "";
                document.getElementById("ticketMessage").value = "";
            } catch (err) {
                showToast("فشل الإرسال: " + err.message, "error");
            }
        }
        window.submitTicket = submitTicket;
    </script>
</body>
</html>
