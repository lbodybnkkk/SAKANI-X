<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حجوزاتي | SAKANI-X</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header class="app-header">
        <a href="index.html" class="nav-item" style="width:auto; color: var(--primary);">
            <i class="fa-solid fa-arrow-right" style="font-size: 20px;"></i>
        </a>
        <span style="font-weight: 800; font-size: 16px;">حجوزاتي</span>
        <div style="width: 42px;"></div>
    </header>

    <div class="filter-chips" style="padding-top: 16px;">
        <button class="chip active" data-status="all" onclick="filterBookings('all', this)">الكل</button>
        <button class="chip" data-status="pending" onclick="filterBookings('pending', this)">⏳ قيد المراجعة</button>
        <button class="chip" data-status="approved" onclick="filterBookings('approved', this)">✅ مقبولة</button>
        <button class="chip" data-status="rejected" onclick="filterBookings('rejected', this)">❌ مرفوضة</button>
    </div>

    <main style="padding: 8px 20px 40px;" id="bookingsList">
        <div style="text-align:center; padding:60px 20px; color: var(--text-muted);">
            <i class="fa-solid fa-spinner fa-spin" style="font-size:32px;"></i>
            <p style="margin-top:12px;">جاري تحميل حجوزاتك...</p>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
        <a href="index.html#favorites" class="nav-item"><i class="fa-solid fa-heart"></i><span>المفضلة</span></a>
        <a href="bookings.html" class="nav-item active"><i class="fa-solid fa-calendar-check"></i><span>حجوزاتي</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
    </nav>

    <script type="module" src="bookings.js"></script>
    
</body>
</html>
